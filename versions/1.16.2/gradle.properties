# No Mod Menu with the com.terraformersmc API works with this version's Fabric API (Mod Menu 1.15+ breaks Fabric API
# <0.30.0, the newest here is 0.20.1+build.401-1.16). Mod Menu is optional (suggests), so the smoke test runs without it.
smoke_without=modmenu,cloth
# Loom upgrades LWJGL to 3.3.2-snapshot when it thinks the game runs on Java 19+ (it uses the Java running Gradle by
# default). Players run this version on Java 8 with the LWJGL Mojang ships, so the smoke test does too.
fabric.loom.runtimeJavaCompatibilityVersion=8
