plugins {
	id 'dev.kikugie.stonecutter'
	id 'fabric-loom' version '1.13-SNAPSHOT'
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

// Release groups, staged publishing and the jar allowlist (shared with mojmap.gradle).
apply from: rootProject.file('gradle/release-target.gradle')

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-mc${cbArchiveSuffix}"
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Old MC 1.14 uses net.fabricmc:fabric, newer uses net.fabricmc.fabric-api:fabric-api
	def fabricApiArtifact = project.findProperty('fabric_api_artifact') ?: 'net.fabricmc.fabric-api:fabric-api'
	modImplementation "${fabricApiArtifact}:${project.fabric_version}"

	// Mod Menu and Cloth Config (only for versions that have cloth-config-fabric)
	if (project.findProperty('cloth_config_version') != 'NONE') {
		modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
		modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
			exclude(group: "net.fabricmc.fabric-api")
			exclude(group: "net.fabricmc", module: "fabric-loader")
		}
	}
}

// Every member of a release group compiles at the group lead's Java level (cbJavaVersion), so the members'
// classes can be compared byte for byte and the lead's jar runs on all of them.
def javaVersion = cbJavaVersion as int

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dep", cbMinecraftDepItems
	inputs.property "java_version", javaVersion
	inputs.property "fabric_api_id", cbFabricApiId

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
			   "minecraft_dep": cbMinecraftDepItems,
			   "java_version": javaVersion,
			   "loader_floor": project.findProperty('loader_floor') ?: '0.14.0',
			   "fabric_api_id": cbFabricApiId
	}

	// The shared mixins.json hardcodes JAVA_21. Mixin refuses to elevate to a compatibility level the
	// running JRE doesn't support, so on the 25 targets whose bundled JVM is < 21 (1.14.3 - 1.20.4) the
	// game crashed at startup. Rewrite the level per target at resource-processing time, driven by the
	// same Java level used above (same technique mojmap.gradle uses for JAVA_25). The shared
	// source file stays untouched; for the Java 21 targets the replacement is a no-op.
	def mixinJavaLevel = "JAVA_${javaVersion}"
	filesMatching("customizable-brightness.mixins.json") {
		filter { String line -> line.replace('"JAVA_21"', "\"${mixinJavaLevel}\"") }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
	// Always javac 21 for the Yarn targets, whatever JDK runs Gradle: keeps their bytes reproducible
	// (javac versions number lambdas differently) and lets one invocation build Yarn and 26.x targets (#1).
	it.javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}

java {
	withSourcesJar()

	def jv = JavaVersion.toVersion(javaVersion)
	sourceCompatibility = jv
	targetCompatibility = jv
}

jar {
	// rootProject: each Stonecutter version is its own project directory, which has no LICENSE of its own.
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

publishMods {
	// File, name, changelog and dry run come from gradle/release-target.gradle (staged files only).
	curseforge {
		projectId = "1388278"
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		// CurseForge now rejects uploads without an environment tag; this mod is client-only.
		clientRequired = true
		serverRequired = false
		minecraftVersions.addAll(cbGroupVersions)
		requires("fabric-api")
		if (project.findProperty('cloth_config_version') != 'NONE') {
			optional("modmenu")
			optional("cloth-config")
		}
	}

	modrinth {
		projectId = "iCas2JlM"
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		minecraftVersions.addAll(cbGroupVersions)
		requires("fabric-api")
		if (project.findProperty('cloth_config_version') != 'NONE') {
			optional("modmenu")
			optional("cloth-config")
		}
	}
}

// Pre-publish smoke test (test-only source set, never in the release jar).
apply from: rootProject.file('gradle/smoke-target.gradle')
