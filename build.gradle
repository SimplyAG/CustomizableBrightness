plugins {
	id 'dev.kikugie.stonecutter'
	id 'fabric-loom' version '1.13-SNAPSHOT'
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Old MC 1.14 uses net.fabricmc:fabric, newer uses net.fabricmc.fabric-api:fabric-api
	def fabricApiArtifact = project.findProperty('fabric_api_artifact') ?: 'net.fabricmc.fabric-api:fabric-api'
	modImplementation "${fabricApiArtifact}:${project.fabric_version}"

	// Mod Menu and Cloth Config (only for versions that have cloth-config-fabric)
	if (project.findProperty('cloth_config_version') != 'NONE') {
		modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
		modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
			exclude(group: "net.fabricmc.fabric-api")
			exclude(group: "net.fabricmc", module: "fabric-loader")
		}
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "java_version", project.findProperty('java_version') ?: '21'
	inputs.property "fabric_api_id", project.findProperty('fabric_api_id') ?: 'fabric'

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
			   "minecraft_version": project.minecraft_version,
			   "java_version": project.findProperty('java_version') ?: '21',
			   "fabric_api_id": project.findProperty('fabric_api_id') ?: 'fabric'
	}

	// The shared mixins.json hardcodes JAVA_21. Mixin refuses to elevate to a compatibility level the
	// running JRE doesn't support, so on the 25 targets whose bundled JVM is < 21 (1.14.3 - 1.20.4) the
	// game crashed at startup. Rewrite the level per target at resource-processing time, driven by the
	// same java_version property used above (same technique mojmap.gradle uses for JAVA_25). The shared
	// source file stays untouched; for the java_version=21 targets the replacement is a no-op.
	def mixinJavaLevel = "JAVA_${project.findProperty('java_version') ?: '21'}"
	filesMatching("customizable-brightness.mixins.json") {
		filter { String line -> line.replace('"JAVA_21"', "\"${mixinJavaLevel}\"") }
	}
}

def javaVersion = Integer.parseInt(project.findProperty('java_version') ?: '21')

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	withSourcesJar()

	def jv = JavaVersion.toVersion(javaVersion)
	sourceCompatibility = jv
	targetCompatibility = jv
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

publishMods {
	file = remapJar.archiveFile
	displayName = "Customizable Brightness ${project.mod_version} - MC ${project.minecraft_version}"
	changelog = "Support for MC ${project.minecraft_version}. Press B to cycle through configurable brightness levels (0%-1000%+)."
	type = STABLE
	modLoaders.add("fabric")

	curseforge {
		projectId = "1388278"
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		// CurseForge now rejects uploads without an environment tag; this mod is client-only.
		clientRequired = true
		serverRequired = false
		minecraftVersions.add(project.property("minecraft_version"))
		requires("fabric-api")
		if (project.findProperty('cloth_config_version') != 'NONE') {
			optional("modmenu")
			optional("cloth-config")
		}
	}

	modrinth {
		projectId = "iCas2JlM"
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		minecraftVersions.add(project.property("minecraft_version"))
		requires("fabric-api")
		if (project.findProperty('cloth_config_version') != 'NONE') {
			optional("modmenu")
			optional("cloth-config")
		}
	}
}
